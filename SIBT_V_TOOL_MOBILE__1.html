<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Zen+Dots&display=swap">
<title>SIBT V TOOL - Mobile Video Maker</title>
<style>
:root{--line:#e4e7ec;--t:#101828;--m:#667085;--a:#6d4aff;--b:#00b8a0}
*{box-sizing:border-box;margin:0}
body{background:#f7f8fc;color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,#f9f9ff,#f2f6fb 55%,#f8f3fb)}
#bg i{position:absolute;border-radius:50%;opacity:.6}
.b1{width:62vmax;height:62vmax;left:-20vmax;top:-24vmax;background:radial-gradient(circle,#b8a6ff,#b8a6ff00 68%)}
.b2{width:56vmax;height:56vmax;right:-22vmax;top:-14vmax;background:radial-gradient(circle,#7fe9d9,#7fe9d900 68%)}
.b3{width:52vmax;height:52vmax;left:8vmax;bottom:-30vmax;background:radial-gradient(circle,#ffb4c8,#ffb4c800 68%)}
header{position:sticky;top:0;z-index:5;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1200px;margin:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;white-space:nowrap;font:400 clamp(13px,4vw,17px)/1.05 "Zen Dots","Orbitron","Arial Black",system-ui,sans-serif;letter-spacing:.06em;color:#ff1f3d;text-shadow:-1.5px -1px 0 #ff3df0,1.5px 1px 0 #19e6ff}
.ltr{opacity:0;transition:opacity .05s}.ltr.on{opacity:1}
.o{font-family:"Orbitron","Arial Black",sans-serif;font-weight:900;font-size:.92em}
.brand small{color:var(--m);font-size:12px}
.ban{display:block;height:44px;width:auto;border-radius:10px;border:1.5px solid #d9d2ff}
.wrap{max-width:1200px;margin:0 auto;padding:14px 14px 0}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn,select{font:inherit;font-weight:600;color:var(--t);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 1px 2px rgba(16,24,40,.05);text-decoration:none;min-height:44px}
.btn:disabled,.btn:has(input:disabled){opacity:.45;pointer-events:none}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.add{flex-direction:column;min-height:92px;font-size:16px;border:1.5px dashed #b9acff;background:#f8f7ff;color:#4b32d6}
.add small{font-weight:500;color:var(--m);font-size:12px}
.add svg{width:28px;height:28px}
.pri{border:0;color:#fff;background:linear-gradient(90deg,var(--a),#8a5cff 55%,var(--b));box-shadow:0 4px 14px #6d4aff44}
.set{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.set label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--m);font-weight:600}
.set select{min-height:38px;padding:6px 10px}
.dng{color:#b42318;border-color:#fecdca;background:#fff5f4;margin-left:auto}
.tip{font-size:12.5px;color:var(--m);margin-top:10px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;max-width:1200px;margin:14px auto 0;padding:0 14px 210px}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;border:1.5px solid transparent;background:linear-gradient(#fffe,#fffe) padding-box,linear-gradient(135deg,var(--g1,#e4e7ec),var(--g2,#e4e7ec)) border-box;box-shadow:0 12px 30px -14px rgba(76,58,180,.28)}
.card[data-s=ready]{--g1:#8b6cff;--g2:#2dd4bf}.card[data-s=work]{--g1:#f59e0b;--g2:#ef4444}.card[data-s=done]{--g1:#22c55e;--g2:#14b8a6}.card[data-s=err]{--g1:#ef4444;--g2:#fb7185}
.card::after{content:"";position:absolute;left:0;top:0;height:3px;width:var(--p,0%);background:linear-gradient(90deg,var(--a),var(--b));transition:width .25s}
.hd{display:flex;justify-content:space-between;align-items:center}
h2{font-size:15px;font-weight:650}
h2 em{font-style:normal;font-weight:800;color:var(--a)}
.r{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:#f2f4f7;color:var(--m)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px}
.chip[data-s=ready]{background:#eef0ff;color:#4b32d6}.chip[data-s=work]{background:#fff4e0;color:#b25e00}.chip[data-s=done]{background:#e3f8ef;color:#067647}.chip[data-s=err]{background:#fee4e2;color:#b42318}
.x{width:34px;height:34px;display:grid;place-items:center;padding:0;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--m);cursor:pointer}
.x:disabled{opacity:.4}
.ic{width:18px;height:18px;flex:none}
.thumb{overflow:hidden;aspect-ratio:16/9;border-radius:14px;display:grid;place-items:center;color:var(--m);font-size:12px;background:linear-gradient(135deg,#f4f2ff,#eefbf8);box-shadow:inset 0 0 0 1px #e6e2ff}
.thumb canvas{width:100%;height:100%}
.info{font-size:13px;padding:8px 12px;border-radius:12px;background:#f8f7ff;border:1px solid #ece9ff;word-break:break-all}
.pick{display:flex;gap:8px}.pick .btn{flex:1;font-size:13px;padding:8px}
.pick .btn.has{border-color:#8be3d2;background:#effcf8;color:#0f766e}
select.loops{flex:none;width:76px;font-weight:700;color:#4b32d6}
.stat{font-size:12px;color:var(--m);word-break:break-word;min-height:16px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(16,24,40,.08)}
.bar>div{max-width:1200px;margin:auto}
#bar{height:6px;border-radius:9px;background:#eaecf0;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .2s}
.line{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--m);margin:6px 0 8px}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}.act .pri{grid-column:1/3;min-height:50px;font-size:16px}
[hidden]{display:none!important}
@media(min-width:700px){.act{grid-template-columns:2fr 1fr 1fr}.act .pri{grid-column:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

<script>
const SR=48000,FR=1024,$=(s,r=document)=>r.querySelector(s),pad=n=>String(n).padStart(2,'0');
const mc=new MessageChannel(),tq=[];mc.port1.onmessage=()=>tq.shift()();const tick=()=>new Promise(r=>{tq.push(r);mc.port2.postMessage(0)});
const guard=(st,p)=>new Promise((res,rej)=>{st.t=Date.now();const iv=setInterval(()=>{if(Date.now()-st.t>90000){clearInterval(iv);rej(Error('Encoder stalled'))}},2000);p.then(v=>{clearInterval(iv);res(v)},e=>{clearInterval(iv);rej(e)})});
const fmt=s=>{s=Math.round(s);return(s/60|0)+':'+pad(s%60)};
const OK='VideoEncoder'in window&&'AudioEncoder'in window&&'OfflineAudioContext'in window;
const MOB=matchMedia('(pointer:coarse)').matches,DM=navigator.deviceMemory||4,HW=navigator.hardwareConcurrency||4;
const BUD=MOB?(DM<=2?150e6:DM<=4?300e6:500e6):1e9,CONC=MOB?(DM>=4&&HW>=6?2:1):Math.min(4,Math.max(2,HW>>1));
const maxSec=()=>Math.floor(BUD*1.5/(SR*8));
const wd=(p,ms,m)=>{let t;return Promise.race([p,new Promise((_,j)=>t=setTimeout(()=>j(Error(m)),ms))]).finally(()=>clearTimeout(t))};
const drain=e=>wd(new Promise(r=>e.addEventListener('dequeue',r,{once:true})),20000,'Encoder stalled');
const bytes=d=>ArrayBuffer.isView(d)?new Uint8Array(d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength)):new Uint8Array(d.slice(0));
const msg=t=>$('#msg').textContent=t,bar=p=>$('#bar i').style.width=(p*100).toFixed(1)+'%';

/* ---- file helpers ---- */
const imgSize=f=>new Promise(res=>{const u=URL.createObjectURL(f),im=new Image();let t;const end=(w,h)=>{clearTimeout(t);im.onload=im.onerror=null;im.removeAttribute('src');URL.revokeObjectURL(u);res([w,h])};im.onload=()=>end(im.naturalWidth,im.naturalHeight);im.onerror=()=>end(0,0);t=setTimeout(()=>end(0,0),8000);im.src=u});
async function bitmapFor(f,W,H){const [w,h]=await imgSize(f);if(w&&h&&Math.max(W/w,H/h)<1){try{return await createImageBitmap(f,w/h>=W/H?{resizeHeight:H,resizeQuality:'high'}:{resizeWidth:W,resizeQuality:'high'})}catch{}}return createImageBitmap(f)}
const probe=f=>new Promise(res=>{const u=URL.createObjectURL(f),a=document.createElement('audio');let t;const end=d=>{clearTimeout(t);a.onloadedmetadata=a.onerror=null;try{a.removeAttribute('src');a.load()}catch{}URL.revokeObjectURL(u);res(d)};a.preload='metadata';a.muted=true;a.onloadedmetadata=()=>end(isFinite(a.duration)?a.duration:0);a.onerror=()=>end(0);t=setTimeout(()=>end(0),8000);a.src=u});
function friendly(e){const n=e&&e.name,m=String(e&&e.message||e);
  if(n==='NotReadableError')return 'Error: The phone could not read this file. Tap Picture/Audio to choose it again.';
  if(n==='RangeError'||n==='QuotaExceededError'||/memory|alloc/i.test(m))return 'Error: Not enough memory. Close other tabs/apps or use a shorter audio.';
  if(/stalled/i.test(m))return 'Error: The encoder stopped responding. Keep the screen on and press Create again.';
  return 'Error: '+m}

/* ---- tiny MP4 writer: image frame stored once, audio loop repeated by reference ---- */
const enc=new TextEncoder(),u8=(...a)=>new Uint8Array(a);
const cat=a=>{let n=0;for(const x of a)n+=x.length;const o=new Uint8Array(n);let p=0;for(const x of a){o.set(x,p);p+=x.length}return o};

const desc=(tag,...p)=>{const b=cat(p);return cat([u8(tag,b.length),b])};
const MAT=u32([65536,0,0,0,65536,0,0,0,1073741824]);
const tkhd=(id,d,vol,w,h)=>box('tkhd',u32([3,0,0,id,0,d,0,0,0,vol<<16]),MAT,u32([w*65536,h*65536]));
const hdlr=(t,n)=>box('hdlr',u32([0,0]),enc.encode(t),u32([0,0,0]),enc.encode(n+'\0'));
const dinf=box('dinf',box('dref',u32([0,1]),box('url ',u32([1]))));
const trak=(id,d,vol,w,h,ts,type,name,head,stbl)=>box('trak',tkhd(id,d,vol,w,h),box('mdia',box('mdhd',u32([0,0,0,ts,d*ts/1000|0,0x55c40000])),hdlr(type,name),box('minf',head,dinf,stbl)));

  const vsz=[],asz=[];for(let i=0;i<V;i++)vsz.push(i%2?v.B.length:v.A.length);for(let n=0;n<N;n++)for(const x of pk)asz.push(x.length);

    for(let i=0;i<V;i++)vo.push(i%2?vB:vA);for(let n=0;n<N;n++)ao.push(a0+n*LB);
    const vst=box('stbl',box('stsd',u32([0,1]),avc1),box('stts',u32(V==1?[0,1,1,total]:[0,2,V-1,step,1,last])),box('stsc',u32([0,1,1,1,1])),box('stsz',u32([0,0,V].concat(vsz))),box('stco',u32([0,V].concat(vo))));
    const ast=box('stbl',box('stsd',u32([0,1]),mp4a),box('stts',u32([0,1,P*N,FR])),box('stsc',u32([0,1,1,P,1])),box('stsz',u32([0,0,P*N].concat(asz))),box('stco',u32([0,N].concat(ao))));
    return box('moov',box('mvhd',u32([0,0,0,1000,total,65536,0x01000000,0,0]),MAT,u32([0,0,0,0,0,0,3])),
      trak(1,total,0,W,H,1000,'vide','VideoHandler',box('vmhd',u32([1,0,0])),vst),
      trak(2,total,256,0,0,SR,'soun','SoundHandler',box('smhd',u32([0,0])),ast))};
  const base=ftyp.length+build(0).length+8,moov=build(base);

/* ---- encoders ---- */
async function audioPart(st,onP){
  if(st.dur>maxSec())throw Error(`Audio is too long for this device (${fmt(st.dur)}). Use a file under ${fmt(maxSec())}.`);
  let buf;try{buf=await new OfflineAudioContext(2,1,SR).decodeAudioData(await st.aud.arrayBuffer())}
  catch(e){if(e&&(e.name==='EncodingError'||e instanceof SyntaxError))throw Error('This audio could not be decoded. Try an MP3, M4A or WAV file.');throw e}
  const len=buf.length,ch=Math.min(2,buf.numberOfChannels);let chans=[...Array(ch).keys()].map(c=>buf.getChannelData(c));
  const ac={codec:'mp4a.40.2',sampleRate:SR,numberOfChannels:ch,bitrate:ch>1?128e3:96e3};
  if(!(await AudioEncoder.isConfigSupported(ac)).supported)throw Error('AAC audio encoding is not supported in this browser. Use Chrome.');
  const pk=[];let err,asc;
  const ae=new AudioEncoder({output:(c,m)=>{const b=new Uint8Array(c.byteLength);c.copyTo(b);pk.push(b);if(!asc&&m&&m.decoderConfig&&m.decoderConfig.description)asc=bytes(m.decoderConfig.description)},error:e=>err=e});
  try{
    ae.configure(ac);const BLK=SR*2;
    for(let s=0,k=0;s<len;s+=BLK,k++){
      if(stop)throw Error('Stopped');
      const n=Math.min(BLK,len-s),d=new Float32Array(n*ch);chans.forEach((x,c)=>d.set(x.subarray(s,s+n),c*n));
      const ad=new AudioData({format:'f32-planar',sampleRate:SR,numberOfFrames:n,numberOfChannels:ch,timestamp:Math.round(s/SR*1e6),data:d});
      ae.encode(ad);ad.close();
      while(ae.encodeQueueSize>6)await drain(ae);
      if(err)throw err;
      if(k%4===0){onP(s/len);await tick()}
    }
    await wd(ae.flush(),60000+len/SR*1000,'Audio encoder stalled');
  }finally{try{ae.close()}catch{}buf=null;chans=null}
  if(err||!pk.length)throw err||Error('Audio could not be decoded');
  if(!asc){const fi=3;asc=u8(2<<3|fi>>1,(fi&1)<<7|ch<<3)}
  return{pk,asc,ch};
}
const CFG=[['6400','no-preference'],['4d00','no-preference'],['4200','no-preference'],['4200','prefer-software']];
async function videoPart(st,W,H){
  const cv=Object.assign(document.createElement('canvas'),{width:W,height:H}),g=cv.getContext('2d');
  const im=await bitmapFor(st.img,W,H),k=Math.max(W/im.width,H/im.height);
  g.drawImage(im,(W-im.width*k)/2,(H-im.height*k)/2,im.width*k,im.height*k);im.close();
  let lastErr;
  for(const [pr,hw] of CFG){
    let ve;
    try{
      const c={codec:`avc1.${pr}${H>720?'28':'1f'}`,width:W,height:H,bitrate:W>1280?8e6:4e6,framerate:30,latencyMode:'quality',hardwareAcceleration:hw};
      if(!(await VideoEncoder.isConfigSupported(c)).supported)continue;
      const out=[];let err,dc;
      ve=new VideoEncoder({output:(ch,m)=>{const b=new Uint8Array(ch.byteLength);ch.copyTo(b);out.push(b);if(!dc&&m&&m.decoderConfig&&m.decoderConfig.description)dc=bytes(m.decoderConfig.description)},error:e=>err=e});
      ve.configure(c);
      for(let i=0;i<2;i++){const vf=new VideoFrame(cv,{timestamp:i*33333,duration:33333});ve.encode(vf,{keyFrame:true});vf.close()}
      await wd(ve.flush(),15000,'Video encoder stalled');
      if(err||!out.length||!dc)throw err||Error('Video encoder returned no data');
      cv.width=cv.height=0;return{A:out[0],B:out[1]||out[0],desc:dc};
    }catch(e){lastErr=e}finally{try{ve&&ve.close()}catch{}}
  }
  throw lastErr||Error('H.264 video encoding is not supported in this browser. Use Chrome.');
}
async function encode(st,onP){
  const [W,H]=$('#res').value.split(',').map(Number);
  const [a,v]=await Promise.all([audioPart(st,p=>onP(.95*p)),videoPart(st,W,H)]);
  const blob=mux(a,v,W,H,st.loops);onP(1);return blob;
}

/* ---- UI ---- */
const S=[],coll=new Intl.Collator(undefined,{numeric:true}).compare,list=$('#list');
let busy=false,stop=false,wl=null;
const loopOpts=(sel)=>[2,3,4,5,6,7,8,9,10].map(n=>`<option value="${n}"${n==sel?' selected':''}>${n}x</option>`).join('');
$('#rep').innerHTML=loopOpts(10);
const chip=(st,t,s='')=>{const e=$('.chip',st.c);e.textContent=t;e.dataset.s=s;st.c.dataset.s=s};
function newItem(){
  const c=document.createElement('section'),st={c,i:S.length,img:null,aud:null,url:null,blob:null,loops:+$('#rep').value,dur:0,p:0};
  c.className='card';
  c.innerHTML=`<div class="hd"><h2>Video <em></em></h2><div class="r"><span class="chip">Empty</span><button class="x" aria-label="Remove this video"><svg class="ic"><use href="#i-x"/></svg></button></div></div>
  <div class="thumb">No picture yet</div><p class="info">No audio yet</p>
  <div class="pick"><label class="btn"><svg class="ic"><use href="#i-img"/></svg>Picture<input type="file" hidden data-k="img" accept="image/*"></label>
  <label class="btn"><svg class="ic"><use href="#i-aud"/></svg>Audio<input type="file" hidden data-k="aud" accept="audio/*"></label>
  <select class="loops" aria-label="Repeat audio">${loopOpts(st.loops)}</select></div>
  <div class="stat"></div><a class="btn pri dl" hidden>Download MP4</a>`;
  c.querySelectorAll('input').forEach(i=>i.onchange=()=>{if(!busy&&i.files[0]){setFile(st,i.dataset.k,i.files[0]);i.value=''}});
  $('.loops',c).onchange=e=>{st.loops=+e.target.value;showInfo(st);reset(st)};
  $('.x',c).onclick=()=>{if(busy)return;URL.revokeObjectURL(st.url);S.splice(S.indexOf(st),1);c.remove();renum();update()};
  S.push(st);list.append(c);renum();return st;
}
function renum(){S.forEach((s,i)=>{s.i=i;$('h2 em',s.c).textContent=pad(i+1);$('.dl',s.c).download=`video-${pad(i+1)}.mp4`})}
function showInfo(st){if(st.aud)$('.info',st.c).textContent=st.dur?`${st.aud.name} - ${fmt(st.dur)} x ${st.loops} = ${fmt(st.dur*st.loops)} video`:st.aud.name}
function reset(st){URL.revokeObjectURL(st.url);st.url=st.blob=null;st.p=0;$('.dl',st.c).hidden=true;$('.stat',st.c).textContent='';st.c.style.setProperty('--p','0%');const ok=st.img&&st.aud;chip(st,ok?'Ready':'Empty',ok?'ready':'');update()}
function setFile(st,k,f){
  $(`[data-k=${k}]`,st.c).parentElement.classList.add('has');
  if(k==='img'){st.img=f;const t=$('.thumb',st.c);
    bitmapFor(f,320,180).then(im=>{if(st.img!==f){im.close();return}const cv=Object.assign(document.createElement('canvas'),{width:320,height:180}),g=cv.getContext('2d'),r=Math.max(320/im.width,180/im.height);g.drawImage(im,(320-im.width*r)/2,(180-im.height*r)/2,im.width*r,im.height*r);im.close();t.replaceChildren(cv)}).catch(()=>{if(st.img===f)t.textContent=f.name});
  }else{st.aud=f;st.dur=0;showInfo(st);probe(f).then(d=>{if(st.aud!==f)return;st.dur=d;showInfo(st);if(d>maxSec())$('.stat',st.c).textContent=`Audio is ${fmt(d)} long. This device handles about ${fmt(maxSec())}.`})}
  reset(st);
}
function addMany(k,files){
  if(busy)return;
  for(const f of [...files].sort((a,b)=>coll(a.name,b.name))){const st=S.find(s=>!s[k])||newItem();setFile(st,k,f)}
  msg(`${S.filter(s=>s.img&&s.aud).length} videos ready. Press Create all videos.`);
}
$('#addImg').onchange=e=>{addMany('img',e.target.files);e.target.value=''};
$('#addAud').onchange=e=>{addMany('aud',e.target.files);e.target.value=''};
$('#rep').onchange=e=>{if(busy)return;S.forEach(s=>{s.loops=+e.target.value;$('.loops',s.c).value=e.target.value;showInfo(s);reset(s)})};
$('#res').onchange=()=>S.forEach(s=>{if(s.blob)reset(s)});
function update(){
  const rdy=S.filter(s=>s.img&&s.aud);$('#cnt').textContent=`${rdy.length} of ${S.length} ready`;
  const dn=S.some(s=>s.blob),todo=rdy.some(s=>!s.blob);
  $('#all').disabled=busy||!OK||!todo;$('#zip').disabled=$('#dlall').disabled=busy||!dn;$('#clr').disabled=busy||!S.length;
  document.querySelectorAll('input[type=file],select,.x').forEach(e=>e.disabled=busy);
}
function lock(b){busy=b;update()}
async function keepAwake(){try{wl=await navigator.wakeLock?.request('screen')}catch{}}
document.addEventListener('visibilitychange',()=>{if(busy&&document.visibilityState==='visible')keepAwake()});

async function run(){
  const L=S.filter(s=>s.img&&s.aud&&!s.blob);
  if(busy)return;if(!L.length)return msg('Add pictures and audios first.');
  lock(true);stop=false;$('#stop').hidden=false;$('#all').hidden=true;await keepAwake();
  const t0=performance.now(),q=[...L];let active=0,mem=0,done=0,fin=0,conc=CONC;
  const upd=()=>{bar(L.reduce((s,x)=>s+(x.blob?1:x.p),0)/L.length);msg(`Creating videos... ${done} of ${L.length} done`)};
  await new Promise(res=>{
    const pump=()=>{
      while(!stop&&q.length&&active<conc&&(!active||mem+(q[0].dur||60)*SR*8<=BUD)){const st=q.shift();st.est=(st.dur||60)*SR*8;active++;mem+=st.est;go(st)}
      if(!active&&(stop||!q.length))res();
    };
    const go=async st=>{
      const stat=$('.stat',st.c);chip(st,'Working','work');
      try{
        let b;for(let t=0;;t++){const g=st.g=(st.g||0)+1;try{b=await guard(st,encode(st,p=>{if(st.g!==g)return;st.t=Date.now();st.p=p;stat.textContent=`Creating ${Math.round(p*100)}%`;st.c.style.setProperty('--p',p*100+'%');upd()}));break}catch(e){if(/stalled/i.test(e.message))conc=1;if(t||stop||!/stalled/i.test(e.message))throw e;st.p=0}}
        st.blob=b;st.url=URL.createObjectURL(b);const a=$('.dl',st.c);a.href=st.url;a.hidden=false;
        stat.textContent=`Done - ${(b.size/1048576).toFixed(1)} MB`;chip(st,'Done','done');st.c.style.setProperty('--p','100%');done++;
      }catch(e){console.error(e);st.p=0;st.c.style.setProperty('--p','0%');stat.textContent=stop?'Stopped':friendly(e);chip(st,stop?'Ready':'Error',stop?'ready':'err')}
      active--;mem-=st.est;fin++;upd();await tick();pump();
    };
    pump();
  });
  bar(stop?0:1);msg(stop?`Stopped after ${done} videos.`:`Finished ${done} of ${L.length} videos in ${((performance.now()-t0)/1000).toFixed(1)} s`);
  try{wl&&wl.release()}catch{}$('#stop').hidden=true;$('#all').hidden=false;lock(false);
}
$('#all').onclick=run;
$('#stop').onclick=()=>{stop=true;msg('Stopping...')};
$('#clr').onclick=()=>{if(busy||!S.length)return;if(confirm('Remove all pictures, audios and finished videos?')){S.forEach(s=>{URL.revokeObjectURL(s.url);s.c.remove()});S.length=0;bar(0);msg('Everything cleared.');update()}};

/* ---- save: ZIP (one download) or one by one ---- */
const CT=new Uint32Array(256).map((_,n)=>{for(let k=0;k<8;k++)n=n&1?0xEDB88320^(n>>>1):n>>>1;return n>>>0});
const crc=b=>{let c=-1;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
const le=spec=>{const a=new Uint8Array(spec.reduce((s,[z])=>s+z,0)),d=new DataView(a.buffer);let p=0;for(const [z,v] of spec){z==4?d.setUint32(p,v,true):d.setUint16(p,v,true);p+=z}return a};
async function zip(items){
  const parts=[],cen=[];let off=0;
  for(const {name,blob} of items){
    const nm=enc.encode(name),c=crc(new Uint8Array(await blob.arrayBuffer())),z=blob.size;
    const lh=cat([le([[4,0x04034b50],[2,20],[2,0x800],[2,0],[2,0],[2,33],[4,c],[4,z],[4,z],[2,nm.length],[2,0]]),nm]);
    cen.push(cat([le([[4,0x02014b50],[2,20],[2,20],[2,0x800],[2,0],[2,0],[2,33],[4,c],[4,z],[4,z],[2,nm.length],[2,0],[2,0],[2,0],[2,0],[4,0],[4,off]]),nm]));
    parts.push(lh,blob);off+=lh.length+z;await tick();
  }
  const cd=cat(cen);return new Blob([...parts,cd,le([[4,0x06054b50],[2,0],[2,0],[2,items.length],[2,items.length],[4,cd.length],[4,off],[2,0]])],{type:'application/zip'});
}
const save=(href,name)=>{const a=Object.assign(document.createElement('a'),{href,download:name});document.body.append(a);a.click();a.remove()};
$('#zip').onclick=async()=>{
  const v=S.filter(s=>s.blob);if(!v.length||busy)return;lock(true);msg('Building ZIP...');
  try{const z=await zip(v.map(s=>({name:`video-${pad(s.i+1)}.mp4`,blob:s.blob}))),u=URL.createObjectURL(z);save(u,'SIBT-videos.zip');setTimeout(()=>URL.revokeObjectURL(u),120000);msg('ZIP saved - check your Downloads folder.')}
  catch(e){msg(friendly(e))}lock(false);
};
$('#dlall').onclick=async()=>{
  const v=S.filter(s=>s.blob);if(!v.length||busy)return;lock(true);
  for(const [n,s] of v.entries()){msg(`Downloading ${n+1} of ${v.length}...`);$('.dl',s.c).click();await new Promise(r=>setTimeout(r,900))}
  msg(`${v.length} downloads started. If some are missing, allow multiple downloads in Chrome or use Save as ZIP.`);lock(false);
};
(()=>{const L=$('#logo'),sp=[];
for(const ch of 'SIBT V TOOL'){const s=document.createElement('span');s.setAttribute('aria-hidden','true');s.textContent=ch===' '?'\u00a0':ch;if(ch==='O')s.className='o';if(ch!==' '){s.classList.add('ltr');sp.push(s)}L.append(s)}
const n=sp.length,seq=[];for(let k=0;k<=n;k++)seq.push(k);seq.push(n,n,n);for(let b=0;b<3;b++)seq.push(0,n);
const show=k=>sp.forEach((s,i)=>s.classList.toggle('on',i<k));
if(matchMedia('(prefers-reduced-motion:reduce)').matches){show(n);return}
let f=0;show(0);setInterval(()=>{show(seq[f]);f=(f+1)%seq.length},240)})();
update();
if(!OK){msg('This browser lacks WebCodecs. Use Chrome or Edge 113+ (Android or desktop).');$('#all').disabled=true}
</script>
